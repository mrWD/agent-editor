<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    The app icon: a dark rounded square with the letters "ae", in the colours and
    the display font (Space Grotesk) of the interface. The square leaves the margin
    macOS expects around an icon. app-icon.png is this drawing at 1024 pixels;
    the files in icons/ are made from it with `npx tauri icon app-icon.png`.
  -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#161920" />
  <rect x="104" y="104" width="816" height="816" rx="182" fill="none" stroke="#343a46" stroke-width="8" />
  <text x="512" y="592" text-anchor="middle" font-family="'Space Grotesk Variable', 'Space Grotesk', sans-serif"
        font-weight="700" font-size="430" letter-spacing="-14" fill="#e7e9ed">ae</text>
  <rect x="330" y="686" width="364" height="22" rx="11" fill="#f5b544" />
</svg>
