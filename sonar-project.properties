# SonarQube settings for a local analysis. Run it with scripts/sonar-local.sh.

sonar.projectKey=agent-editor
sonar.projectName=Agent Editor
sonar.sourceEncoding=UTF-8

# Code and tests live in the same folders. The patterns below tell them apart.
sonar.sources=crates,ui,.github
sonar.tests=crates,ui

# Tests: the Rust end-to-end tests, the interface unit tests and browser tests.
# Unit tests written inside Rust source files stay with the code they test.
# SonarQube cannot tell them apart.
sonar.test.inclusions=crates/*/tests/**,ui/src/**/*.test.ts,ui/e2e/**

# Not code: the tests listed above, and everything built, downloaded or generated.
sonar.exclusions=crates/*/tests/**,ui/src/**/*.test.ts,ui/e2e/**,\
  design/**,target/**,data/**,ui/dist/**,ui/coverage/**,ui/node_modules/**,\
  ui/test-results/**,ui/playwright-report/**

# Config files hold no logic worth covering with tests.
sonar.coverage.exclusions=ui/*.config.ts,ui/*.config.js

# TypeScript. `npm run test:coverage` in ui/ writes the coverage file.
sonar.javascript.lcov.reportPaths=ui/coverage/lcov.info
sonar.typescript.tsconfigPaths=ui/tsconfig.json

# Rust. The scanner runs in a container that has no cargo, so it cannot run
# Clippy itself. The script runs Clippy on this machine and hands over the report.
# Rust coverage is optional. The script passes sonar.rust.lcov.reportPaths
# when it has made .sonar/rust-lcov.info (this needs cargo-llvm-cov).
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=.sonar/clippy-report.json

# The interface is written in Solid, where a label points at its field with `for`.
# This rule looks for React's `htmlFor` and reports every such label as unconnected.
# Each reported label was checked by hand: its `for` matches the `id` of its field.
sonar.issue.ignore.multicriteria=solidLabels
sonar.issue.ignore.multicriteria.solidLabels.ruleKey=typescript:S6853
sonar.issue.ignore.multicriteria.solidLabels.resourceKey=ui/src/**/*.tsx
