name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the run of the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS is checked on the author's own machine. In a private repository its minutes count ten times,
        # so it is left out here; add `macos-latest` back to check it in CI too.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  ui:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Types, lint, format and unit tests
        run: npm run check
      - run: npm run build

  e2e:
    # One job for each engine: a hosted machine runs the tests one at a time, and all three engines
    # in a row take about an hour.
    name: Browser tests in ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps ${{ matrix.engine }}
        working-directory: ui
      # Builds the core and the interface itself, then runs every test in this job's engine.
      - run: npm run e2e -- --project=${{ matrix.engine }}
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.engine }}
          path: ui/playwright-report

  # The desktop app is a workspace of its own (crates/shell), so the jobs above
  # never build Tauri. This job does: it checks the app's code and builds the
  # bundles people install. Nothing is signed.
  shell:
    name: Desktop app on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # An older Ubuntu on purpose: an app built there also runs on newer systems, not the other way round.
        # No macOS here either, for the same reason as above: the .app and the .dmg are built by hand on a Mac.
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # The practice agent is built in the main workspace, the app in its own.
          workspaces: |
            . -> target
            crates/shell -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            crates/shell/package-lock.json
      - name: Libraries Tauri needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - run: npm ci
        working-directory: ui
      - run: npm ci
        working-directory: crates/shell
      # The app's code does not compile without the two things it carries inside.
      - name: Build the interface and the practice agent
        run: node prepare.mjs
        working-directory: crates/shell
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt -- --check
        working-directory: crates/shell
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: crates/shell
      - name: Test
        run: cargo test
        working-directory: crates/shell
      # macOS: .app and .dmg. Windows: an installer (.exe). Linux: .deb and .AppImage.
      - name: Bundle
        run: npx tauri build
        working-directory: crates/shell
      - uses: actions/upload-artifact@v4
        with:
          name: agent-editor-${{ runner.os }}
          if-no-files-found: error
          path: |
            crates/shell/target/release/bundle/dmg/*.dmg
            crates/shell/target/release/bundle/nsis/*.exe
            crates/shell/target/release/bundle/deb/*.deb
            crates/shell/target/release/bundle/appimage/*.AppImage
