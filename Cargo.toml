[workspace]
resolver = "3"
members = ["crates/core", "crates/mock-agent"]
# The desktop app is a workspace of its own: see crates/shell/Cargo.toml for why.
exclude = ["crates/shell"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 4
